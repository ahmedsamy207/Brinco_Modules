# OpenOCD session: ST-Link V2 / V2-1 (SWD) + PY32F040xB
#
#   openocd -s Tools/openocd-puya/script -s Tools/openocd-puya \
#           -f stlink-py32f040.cfg -c "program Build/app.hex verify reset exit"
#
# `make flash FLASH_PROGRM=openocd` / `make flash-openocd` do this for you.
#
# The bundled OpenOCD is Puya's 0.12.0 build with the "puyaf0x" flash driver.
# It talks to ST-Link probes through the dapdirect interface driver, which
# requires ST-Link firmware V2J24 (2015) or newer - every ST-Link V2 / V2-1 in
# circulation qualifies. Firmware older than that only supports the deprecated
# `hla` driver, which the py32f0xx target script cannot use.

# Flash bank size: PY32F040xB = 128 KB (PY32F040C1BT6).
# Must be set before target/py32f0xx.cfg is sourced (it uses this value when
# the bank is created). Without it the script falls back to 0x5000.
set FLASH_SIZE 0x20000

# RAM used as the flash programming buffer.
set WORKAREASIZE 0x1000

# dapdirect, not hla: target/py32f0xx.cfg creates a DAP, which hla cannot do.
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd

source [find target/py32f0xx.cfg]

# Note: target/py32f0xx.cfg deliberately runs SWD at 100 kHz and re-applies
# that speed in its reset-start/reset-end events, so raising it here would be
# overridden. 100 kHz is slow but very tolerant of wiring - a ~15 KB image
# needs only a few seconds. If you want a faster link, edit the three
# "adapter speed 100" lines in Tools/openocd-puya/script/target/py32f0xx.cfg.
